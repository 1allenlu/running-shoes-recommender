# Stage 1 fit scorer (CLAUDE_CODE_PROMPT.md section 5).
# Every number here is a starting guess, logged in docs/DECISIONS.md. Tune freely: the code
# reads this file, so changing a weight needs no code change. Bump `version` when you do, so
# stored recommendations record which settings ranked them.
version: stage1-v1

# Final score = sum(weight x sub-score) / sum(weights that apply to this runner), so it is 0-1.
weights:
  width_fit: 0.30
  volume_fit: 0.20
  heel_fit: 0.10
  combo_fit: 0.15     # only applies to a wide forefoot with a low instep
  ride_fit: 0.10
  history_fit: 0.10   # only applies once the runner has rated shoes we know
  budget_fit: 0.05    # only applies when a budget is set
# Pressure distribution and arch flexibility are context only: they are shown, never scored,
# and never route anyone to stability shoes. Whether they should ever carry weight is an
# open question for the owner.

# Sub-score used when the spec a sub-score needs is still null (TODO in the seed data).
unknown_score: 0.5

# Issue tags from shoe history raise the weight of the feature they point at.
issue_weight_boosts:
  toe_pressure: {width_fit: 1.5}
  too_narrow: {width_fit: 1.5}
  heel_slip: {heel_fit: 1.5}
  too_much_volume: {volume_fit: 1.5}
  too_soft: {ride_fit: 1.3}
  too_firm: {ride_fit: 1.3}
  arch_discomfort: {}

width:
  # OPEN QUESTION (owner): width letter -> target toe box width in mm, measured the way
  # toebox_width_mm is entered. These are placeholders so the code runs; replace them.
  target_toebox_mm: {3A: 88, 2A: 90, A: 92, B: 94, C: 96, D: 98, E: 101, 2E: 104, 3E: 107}
  narrow_tolerance_mm: 6    # a toe box this much narrower than target scores 0
  wide_tolerance_mm: 12     # a toe box this much wider than target scores 0
  wide_version_extra_mm: 5  # assumed extra room in a shoe's wide version (no per-width specs yet)
  # Used when toebox_width_mm is null but the qualitative toe_box is known.
  toe_box_scores:
    wide_foot: {roomy: 1.0, medium: 0.6, narrow: 0.2}
    standard_foot: {roomy: 0.8, medium: 1.0, narrow: 0.7}
  wide_version_score: 0.8   # wide foot, shoe offered in wide, toe box otherwise unknown
  no_wide_version_score: 0.2

volume:  # upper_volume score by instep band
  low: {low: 1.0, medium: 0.8, high: 0.3}
  medium: {low: 0.7, medium: 1.0, high: 0.7}
  high: {low: 0.2, medium: 0.8, high: 1.0}
  heel_lock_bonus_low_instep: 0.1   # a heel lock eyelet helps lock down a low instep

heel:
  # Narrow/medium heel with a wide forefoot: the heel needs holding.
  counter_scores: {firm: 1.0, medium: 0.7, soft: 0.3}
  lock_scores: {true: 1.0, false: 0.4}
  # Otherwise no special heel need: every shoe gets this, so it does not change the order.
  no_special_need: 0.8

combo:
  roomy_width_fit: 0.7   # width_fit at or above this counts as a roomy toe box
  wide_version_penalty: 0.6  # multiplier when toe room only comes from a wide version

ride:
  feel_scores:  # [preferred feel][shoe midsole_softness]
    soft: {soft: 1.0, balanced: 0.5, firm: 0.0}
    balanced: {soft: 0.6, balanced: 1.0, firm: 0.6}
    firm: {soft: 0.0, balanced: 0.5, firm: 1.0}
  # Goals that prefer a higher or lower stack (goal labels from the questionnaire).
  stack_by_goal:
    Half marathon: high
    Marathon: high
    5K / 10K: low
    Speed work: low
  high_stack_min_mm: 35
  low_stack_max_mm: 32
  stack_mismatch_score: 0.6

budget:
  over_budget_allowance: 0.10  # filters allow up to 10% over budget, with a flag
  full_reward_under_fraction: 0.30  # 30% or more under budget gets the full sub-score

filters:
  wide_min_letter: 2E          # from this width up, the shoe needs a wide version...
  wide_toebox_min_mm: 103      # ...or a toe box at least this wide (placeholder)
  # Goal label -> categories that suit it. No goals, or unmapped goals, allow every category.
  categories_by_goal:
    Daily training: [daily, max-cushion, stability]
    5K / 10K: [daily, tempo, race]
    Half marathon: [daily, tempo, max-cushion, stability]
    Marathon: [daily, tempo, race, max-cushion, stability]
    Speed work: [tempo, race]
    Getting back into running: [daily, max-cushion, stability]
  # An issue reported on 2+ shoes excludes shoes whose known specs match these values.
  recurring_issue_excludes:
    toe_pressure: {toe_box: [narrow]}
    too_narrow: {toe_box: [narrow]}
    heel_slip: {heel_counter: [soft]}
    too_much_volume: {upper_volume: [high]}
    too_soft: {midsole_softness: [soft]}
    too_firm: {midsole_softness: [firm]}

history:
  min_shared_dims: 3   # need this many known specs in common to compare two shoes

sizing:
  running_allowance: 0.5   # added to the foot's size in the brand (CLAUDE_CODE_PROMPT.md)
